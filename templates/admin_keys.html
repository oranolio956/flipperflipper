<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Key Management - FlipperFlipper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-tertiary: #94a3b8;
            --border-primary: #334155;
            --border-secondary: #475569;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #1e293b 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 32px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .keys-table {
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--bg-tertiary);
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 14px;
        }

        td {
            padding: 16px;
            border-top: 1px solid var(--border-primary);
        }

        tr:hover {
            background: var(--bg-tertiary);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .badge-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .key-display {
            background: var(--bg-tertiary);
            padding: 16px;
            border-radius: 6px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            word-break: break-all;
            margin-bottom: 16px;
        }

        .alert {
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-tertiary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-primary);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔑 Access Key Management</h1>
            <div>
                <button class="btn btn-secondary" onclick="window.location.href='/dashboard'">← Back to Dashboard</button>
                <button class="btn btn-primary" onclick="openCreateModal()">+ Create Key</button>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="keys-table">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Permissions</th>
                        <th>Created</th>
                        <th>Last Used</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="keysTableBody">
                    <tr>
                        <td colspan="6">
                            <div class="loading">
                                <div class="spinner"></div>
                                <div>Loading access keys...</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create Key Modal -->
    <div id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Create Access Key</h2>
                <button class="close-btn" onclick="closeCreateModal()">×</button>
            </div>
            <form id="createKeyForm">
                <div class="form-group">
                    <label for="keyName">Key Name *</label>
                    <input type="text" id="keyName" required placeholder="e.g., Production API Key">
                </div>
                <div class="form-group">
                    <label for="keyPermissions">Permissions</label>
                    <select id="keyPermissions" multiple size="3">
                        <option value="read" selected>Read</option>
                        <option value="write">Write</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="keyExpires">Expires At (optional)</label>
                    <input type="datetime-local" id="keyExpires">
                </div>
                <div class="form-group">
                    <label for="keyIpWhitelist">IP Whitelist (optional, one per line)</label>
                    <textarea id="keyIpWhitelist" rows="3" placeholder="192.168.1.0/24&#10;10.0.0.1"></textarea>
                </div>
                <div class="form-group">
                    <label for="keyUsageLimit">Usage Limit (optional)</label>
                    <input type="number" id="keyUsageLimit" placeholder="Leave empty for unlimited">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Key</button>
            </form>
        </div>
    </div>

    <!-- Key Created Modal -->
    <div id="keyCreatedModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">✅ Access Key Created</h2>
                <button class="close-btn" onclick="closeKeyCreatedModal()">×</button>
            </div>
            <div class="alert alert-warning">
                ⚠️ Save this key now! It will not be shown again.
            </div>
            <div class="key-display" id="createdKey"></div>
            <button class="btn btn-primary" style="width: 100%;" onclick="copyKey()">📋 Copy Key</button>
        </div>
    </div>

    <script>
        let keys = [];

        // Load keys on page load
        document.addEventListener('DOMContentLoaded', loadKeys);

        // Load all keys
        async function loadKeys() {
            try {
                const response = await fetch('/dashboard/api/admin/keys');
                if (!response.ok) throw new Error('Failed to load keys');
                
                keys = await response.json();
                renderKeys();
            } catch (error) {
                showAlert('Error loading keys: ' + error.message, 'error');
            }
        }

        // Render keys table
        function renderKeys() {
            const tbody = document.getElementById('keysTableBody');
            
            if (keys.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-tertiary);">
                            No access keys found. Create one to get started.
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = keys.map(key => `
                <tr>
                    <td><strong>${key.name}</strong></td>
                    <td>${key.permissions.join(', ')}</td>
                    <td>${formatDate(key.created_at)}</td>
                    <td>${key.last_used ? formatDate(key.last_used) : 'Never'}</td>
                    <td>
                        <span class="badge ${key.is_active ? 'badge-success' : 'badge-error'}">
                            ${key.is_active ? 'Active' : 'Revoked'}
                        </span>
                    </td>
                    <td>
                        ${key.is_active ? `
                            <button class="btn btn-danger" onclick="revokeKey(${key.id}, '${key.name}')">
                                Revoke
                            </button>
                        ` : ''}
                    </td>
                </tr>
            `).join('');
        }

        // Format date
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        // Open create modal
        function openCreateModal() {
            document.getElementById('createModal').classList.add('active');
        }

        // Close create modal
        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('active');
            document.getElementById('createKeyForm').reset();
        }

        // Close key created modal
        function closeKeyCreatedModal() {
            document.getElementById('keyCreatedModal').classList.remove('active');
            loadKeys(); // Refresh the list
        }

        // Create key form submission
        document.getElementById('createKeyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('keyName').value;
            const permissionsSelect = document.getElementById('keyPermissions');
            const permissions = Array.from(permissionsSelect.selectedOptions).map(opt => opt.value);
            const expires = document.getElementById('keyExpires').value;
            const ipWhitelist = document.getElementById('keyIpWhitelist').value
                .split('\n')
                .map(ip => ip.trim())
                .filter(ip => ip);
            const usageLimit = document.getElementById('keyUsageLimit').value;
            
            try {
                const response = await fetch('/dashboard/api/admin/keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        permissions,
                        expires_at: expires || null,
                        ip_whitelist: ipWhitelist.length > 0 ? ipWhitelist : null,
                        usage_limit: usageLimit ? parseInt(usageLimit) : null
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to create key');
                }
                
                const result = await response.json();
                
                // Show the created key
                document.getElementById('createdKey').textContent = result.key;
                closeCreateModal();
                document.getElementById('keyCreatedModal').classList.add('active');
                
                showAlert('Access key created successfully!', 'success');
            } catch (error) {
                showAlert('Error creating key: ' + error.message, 'error');
            }
        });

        // Copy key to clipboard
        function copyKey() {
            const keyText = document.getElementById('createdKey').textContent;
            navigator.clipboard.writeText(keyText).then(() => {
                showAlert('Key copied to clipboard!', 'success');
            });
        }

        // Revoke key
        async function revokeKey(keyId, keyName) {
            if (!confirm(`Are you sure you want to revoke the key "${keyName}"? This action cannot be undone.`)) {
                return;
            }
            
            try {
                const response = await fetch(`/dashboard/api/admin/keys/${keyId}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to revoke key');
                }
                
                showAlert('Access key revoked successfully', 'success');
                loadKeys();
            } catch (error) {
                showAlert('Error revoking key: ' + error.message, 'error');
            }
        }

        // Show alert
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }
    </script>
</body>
</html>
